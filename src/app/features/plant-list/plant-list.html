<section class="mx-auto max-w-7xl px-6 py-8">
  <header class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-semibold text-[var(--text-primary)]">Global Plants List</h1>
      <p class="mt-2 text-sm text-[var(--text-secondary)]">Gestione centralizzata di {{ totalItems() }} siti produttivi.</p>
    </div>
    <mat-form-field appearance="outline" class="w-full sm:w-80 subscript-hidden">
      <mat-label>Cerca impianto o località...</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>
  </header>

  <div class="rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-[var(--shadow-sm)] overflow-hidden">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome Impianto </th>
        <td mat-cell *matCellDef="let p">
          <button (click)="viewPlant(p)" class="text-left font-medium hover:underline">{{p.name}}</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef> Cliente </th>
        <td mat-cell *matCellDef="let p" class="text-sm text-[var(--text-secondary)]">{{p.customerName}}</td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Località </th>
        <td mat-cell *matCellDef="let p" class="text-sm text-[var(--text-tertiary)]">{{p.location || '—'}}</td>
      </ng-container>

      <ng-container matColumnDef="stationsCount">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Stazioni </th>
        <td mat-cell *matCellDef="let p" class="text-center font-mono text-xs">{{p.stationsCount}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="w-20"></th>
        <td mat-cell *matCellDef="let p" class="text-right">
          <button mat-icon-button (click)="viewPlant(p)" matTooltip="Visualizza"><mat-icon>visibility</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="totalItems()" [pageSize]="pageSize()" [pageIndex]="pageIndex()" [pageSizeOptions]="[10, 25, 50]" (page)="onPageChange($event)"></mat-paginator>
  </div>
</section>
