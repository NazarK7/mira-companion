<section class="max-w-4xl mx-auto py-8 px-4">
  <header class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-text-primary">
        {{ isEditMode() ? 'Edit Plant' : 'New Plant' }}
      </h1>
      <p class="text-text-secondary mt-1">Configure manufacturing site and site-specific contacts</p>
    </div>
    <div class="flex gap-4">
      <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
      <button type="button" mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
        {{ isEditMode() ? 'Update Plant' : 'Create Plant' }}
      </button>
    </div>
  </header>

  <form [formGroup]="form" class="flex flex-col gap-8">
    <div class="p-6 bg-surface border border-divider rounded-xl grid grid-cols-2 gap-6">
      <h3 class="col-span-2 text-lg font-medium text-text-primary">Plant Information</h3>
      
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Plant Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Torslanda Plant">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>City / Location</mat-label>
        <input matInput formControlName="location">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address">
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="p-6 bg-surface border border-divider rounded-xl">
      <app-contact-list [contactsArray]="contactsArray" />
    </div>
  </form>
</section>
