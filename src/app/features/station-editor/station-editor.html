<section class="max-w-4xl mx-auto py-10 px-6 space-y-8 animate-in fade-in duration-500">

  <header class="flex items-center gap-6 border-b border-border-subtle pb-8">
    <app-button variant="ghost" size="icon" (clicked)="cancel()">
      <span class="material-symbols-outlined">arrow_back</span>
    </app-button>
    <div>
      <h1 class="text-4xl font-black text-text-primary italic tracking-tighter uppercase leading-none">
        {{ isEditMode() ? 'Edit Station' : 'New Station' }}
      </h1>
      <p class="text-sm font-medium text-text-tertiary uppercase tracking-widest mt-2">
        Configurazione Cella Robotizzata / Parametri Visione
      </p>
    </div>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-8">

    <div class="bg-bg-surface border border-border-subtle rounded-2xl p-8 shadow-sm space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div class="flex flex-col gap-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Station Name *</label>
          <input formControlName="name" placeholder="Assy Cell LH"
            class="bg-bg-subtle border border-border-subtle rounded-xl px-4 py-3 text-text-primary focus:border-primary-500 outline-none transition-all" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Station Code</label>
          <input formControlName="code" placeholder="17-54-020"
            class="bg-bg-subtle border border-border-subtle rounded-xl px-4 py-3 text-text-primary focus:border-primary-500 outline-none transition-all font-mono" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Production Line</label>
          <input formControlName="line" placeholder="Body Shop Line A"
            class="bg-bg-subtle border border-border-subtle rounded-xl px-4 py-3 text-text-primary focus:border-primary-500 outline-none transition-all" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Current Status</label>
          <select formControlName="status"
            class="bg-bg-surface border border-border-subtle rounded-xl px-4 py-3 text-text-primary focus:border-primary-500 outline-none transition-all appearance-none cursor-pointer w-full">
            @for (opt of statusOptions; track opt.value) {
            <option [value]="opt.value" class="bg-bg-surface text-text-primary">
              {{ opt.label }}
            </option>
            }
          </select>
        </div>

        <div class="flex flex-col gap-2 md:col-span-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Description</label>
          <textarea formControlName="description" rows="2"
            class="bg-bg-subtle border border-border-subtle rounded-xl px-4 py-3 text-text-primary focus:border-primary-500 outline-none transition-all resize-none"></textarea>
        </div>
      </div>
    </div>

    <div class="bg-bg-surface border border-border-subtle rounded-2xl p-8 shadow-sm space-y-6">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-warning-500">terminal</span>
        <h3 class="text-xl font-bold text-text-primary tracking-tight italic uppercase">Recovery Procedure</h3>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-[10px] font-black uppercase tracking-widest text-text-tertiary">Istruzioni operative in caso
          di errore visione</label>
        <textarea formControlName="recoveryProcedure" rows="4" placeholder="1. Reset PLC... 2. Check Exposure..."
          class="bg-bg-app border border-border-subtle rounded-xl px-4 py-3 text-text-primary font-mono text-xs focus:border-primary-500 outline-none transition-all"></textarea>
      </div>
    </div>

    <footer class="flex justify-end gap-4 pt-4 border-t border-border-subtle">
      <app-button variant="ghost" (clicked)="cancel()" [disabled]="isSubmitting()">Cancel</app-button>
      <app-button variant="primary" type="submit" [loading]="isSubmitting()" [disabled]="form.invalid">
        <span class="material-symbols-outlined">save</span>
        {{ isEditMode() ? 'Update Station' : 'Create Station' }}
      </app-button>
    </footer>
  </form>
</section>
