 <section class="max-w-4xl mx-auto py-8 px-4">
      <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
          <button mat-icon-button type="button" (click)="cancel()" aria-label="Back">
            <mat-icon>arrow_back</mat-icon>
          </button>
          <div>
            <h1 class="text-3xl font-bold text-[var(--text-primary)]">
              {{ isEditMode() ? 'Edit Station' : 'New Station' }}
            </h1>
            <p class="text-[var(--text-secondary)] mt-1">Configure robotic cell / station parameters</p>
          </div>
        </div>
      </header>

      <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-8">
        <div class="p-6 bg-[var(--bg-surface)] border border-[var(--border-subtle)] rounded-xl grid grid-cols-2 gap-6 shadow-sm">
          
          <mat-form-field appearance="outline" class="col-span-2 md:col-span-1">
            <mat-label>Station Name</mat-label>
            <input matInput formControlName="name" placeholder="e.g. Body Side Assy LH" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2 md:col-span-1">
            <mat-label>Station Code</mat-label>
            <input matInput formControlName="code" placeholder="e.g. 17-54-020">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2 md:col-span-1">
            <mat-label>Line</mat-label>
            <input matInput formControlName="line" placeholder="e.g. Body Shop Line A">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2 md:col-span-1">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option value="PRODUCTION">Production</mat-option>
              <mat-option value="MAINTENANCE">Maintenance</mat-option>
              <mat-option value="PLANNING">Planning</mat-option>
              <mat-option value="ARCHIVED">Archived</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="2"></textarea>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2">
            <mat-label>Recovery Procedure</mat-label>
            <textarea matInput formControlName="recoveryProcedure" rows="3" placeholder="Steps to recover from a vision error..."></textarea>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-span-2">
            <mat-label>Internal Notes</mat-label>
            <textarea matInput formControlName="notes" rows="2"></textarea>
          </mat-form-field>

        </div>

        <div class="flex justify-end gap-4">
          <button type="button" mat-button (click)="cancel()" [disabled]="isSubmitting()">Cancel</button>
          <button type="submit" mat-flat-button color="primary" class="!bg-[var(--color-primary-600)]" [disabled]="form.invalid || isSubmitting()">
            <mat-icon>save</mat-icon>
            {{ isSubmitting() ? 'Saving...' : (isEditMode() ? 'Update Station' : 'Create Station') }}
          </button>
        </div>
      </form>
    </section>
