<canvas #canvasEl class="three-viewer__canvas absolute inset-0 z-0"></canvas>

<!-- Scala di riferimento (bottom-left, sempre presente) -->
<div class="absolute bottom-3 left-3 pointer-events-none select-none z-40
            px-2 py-1 rounded bg-black/30 backdrop-blur-sm border border-white/5
            flex items-center gap-2">
  <div [style.width.px]="scaleWidthPx() || 50"
       class="border-x border-b border-white/70 h-1.5 transition-all duration-100">
  </div>
  <span class="text-white/70 text-[10px] font-mono">{{ scaleLabel() }}</span>
</div>

<!-- Pannello info scena (bottom-right quando NON c'è selezione) -->
@if (!selectedPoseInfo() && poses().length > 0) {
  <div class="absolute bottom-3 right-3 pointer-events-none select-none z-40
              px-3 py-2 rounded-lg bg-black/30 backdrop-blur-sm border border-white/5
              flex items-center gap-3 text-[11px] font-mono">
    <span class="text-white/50">Pose</span>
    <span class="text-white font-bold">{{ poses().length }}</span>
    <span class="text-white/30">·</span>
    <span class="text-white/50">Click su un frustum per dettagli</span>
  </div>
}
