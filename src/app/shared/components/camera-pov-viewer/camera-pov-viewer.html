<div class="pov-frame"
     [style.aspect-ratio]="cameraSpec().resolution_px.w + ' / ' + cameraSpec().resolution_px.h">
  <canvas #canvasEl class="pov-canvas"></canvas>

  <div class="pov-overlay">
    <span class="pov-coverage" [class.pov-coverage--good]="fovStatus() === 'in-fov'"
                                 [class.pov-coverage--warn]="fovStatus() === 'partial'"
                                 [class.pov-coverage--bad]="fovStatus() === 'out-of-fov'">
      {{ coverageLabel() }}
    </span>
    <span class="pov-fov-info">
      {{ cameraSpec().resolution_px.w }}×{{ cameraSpec().resolution_px.h }} · {{ lensSpec().focal_length_mm }}mm
    </span>
  </div>

  <!-- crosshair centrale per riferimento visivo -->
  <div class="pov-crosshair">
    <div class="pov-crosshair__h"></div>
    <div class="pov-crosshair__v"></div>
  </div>

  <!-- regola dei terzi -->
  <div class="pov-rule-of-thirds">
    <div></div><div></div>
    <div></div><div></div>
  </div>
</div>

@if (totalPoses() > 1) {
  <div class="pov-pagination">
    <button type="button"
            class="pov-page-btn"
            (click)="prevPose()"
            [disabled]="!canPrev()"
            aria-label="Pose precedente">
      ‹
    </button>
    <div class="pov-page-input">
      <input type="number"
             [min]="1"
             [max]="totalPoses()"
             [ngModel]="displayIndex()"
             (change)="onIndexInputChange($any($event.target).value)"
             aria-label="Numero pose corrente" />
      <span class="pov-page-total">/ {{ totalPoses() }}</span>
    </div>
    <button type="button"
            class="pov-page-btn"
            (click)="nextPose()"
            [disabled]="!canNext()"
            aria-label="Pose successiva">
      ›
    </button>
  </div>
}
