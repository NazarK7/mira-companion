<div class="pov-frame" [style.aspect-ratio]="cameraSpec().resolution_px.w + ' / ' + cameraSpec().resolution_px.h">
  <canvas #canvasEl class="pov-canvas"></canvas>

  <div class="pov-overlay">
    <span class="pov-coverage" [class.pov-coverage--good]="fovStatus() === 'in-fov'"
      [class.pov-coverage--warn]="fovStatus() === 'partial'" [class.pov-coverage--bad]="fovStatus() === 'out-of-fov'">
      {{ coverageLabel() }}
    </span>
    <span class="pov-fov-info">
      {{ cameraSpec().resolution_px.w }}×{{ cameraSpec().resolution_px.h }} · {{ lensSpec().focal_length_mm }}mm
    </span>
  </div>

  <!-- crosshair centrale per riferimento visivo -->
  <div class="pov-crosshair">
    <div class="pov-crosshair__h"></div>
    <div class="pov-crosshair__v"></div>
  </div>

  <!-- regola dei terzi -->
  <div class="pov-rule-of-thirds">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>

@if (totalPoses() > 1) {
<div class="flex items-center justify-center gap-2 mt-2 mb-2" aria-label="Navigazione pose">
  <app-button variant="outline" size="icon" (clicked)="prevPose()" [disabled]="!canPrev()" aria-label="Pose precedente">
    <span class="material-symbols-outlined text-[20px]">chevron_left</span>
  </app-button>

  <div
    class="flex items-center gap-2 px-3 min-h-[36px] bg-bg-surface border border-border-subtle rounded-lg focus-within:border-primary-500 focus-within:ring-2 focus-within:ring-primary-500/20 transition-all">
    <input type="number" [min]="1" [max]="totalPoses()" [ngModel]="displayIndex()"
      (change)="onIndexInputChange($any($event.target).value)"
      (keydown.enter)="onIndexInputChange($any($event.target).value)"
      class="w-12 text-center bg-transparent border-none text-text-primary font-bold text-sm outline-none font-mono focus:ring-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none [-moz-appearance:textfield]"
      aria-label="Numero pose corrente" />
    <span class="text-text-tertiary text-[11px] font-bold font-mono leading-none">/ {{ totalPoses() }}</span>
  </div>

  <app-button variant="outline" size="icon" (clicked)="nextPose()" [disabled]="!canNext()" aria-label="Pose successiva">
    <span class="material-symbols-outlined text-[20px]">chevron_right</span>
  </app-button>
</div>
}
